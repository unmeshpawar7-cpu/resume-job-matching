# Curated skills taxonomy used for deterministic skill extraction.
#
# Fields
#   name                canonical skill name (also matched, case-insensitively, unless
#                       name_case_sensitive is true)
#   category            language | backend | frontend | mobile | database | cloud | devops |
#                       data | ml_ai | architecture | testing | security | practice
#   aliases             alternative spellings, matched case-insensitively with token
#                       boundaries ("java" never matches "JavaScript", "c" never matches "C#")
#   exact_case_aliases  aliases matched case-sensitively (for ambiguous words: "Go", "REST")
#   related             skills that earn *partial* credit when this one is missing.
#                       Relations are symmetric; every name must exist in this file.
#
# Matching is per skill and may overlap: "SQL Server" yields both "SQL Server" and "SQL",
# "Azure Functions" yields both "Azure Functions" and "Azure".
