[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "resume-job-matching"
version = "1.0.0"
description = "Explainable resume to job-description matching API: deterministic + semantic scoring, LLM-written narrative."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Unmesh Pawar" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",
    "numpy>=1.26,<3.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.5,<10.0",
    "PyJWT>=2.9,<3.0",
    "bcrypt>=4.2,<6.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0,<7.0",
    "pypdf>=4.3,<7.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40,<3.0"]
anthropic = ["anthropic>=0.34,<1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "fpdf2>=2.7,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resume_matching"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "PT", "RET", "TID"]
ignore = [
    "S101",   # assert is fine in tests and for invariants
    "B008",   # FastAPI Depends() in argument defaults is idiomatic
    "RUF012", # mutable class attributes are fine for SQLAlchemy/Pydantic config
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["resume_matching"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "postgres: integration tests that need a PostgreSQL + pgvector database (set TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pypdf.*",
]

[tool.coverage.run]
source = ["resume_matching"]
branch = true
omit = ["src/resume_matching/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
